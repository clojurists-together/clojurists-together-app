name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SLACK_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/app_test?user=app_test&password=app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.9.8
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-
      - run: lein cljfmt check
      - run: lein test
